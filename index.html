
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LungSight - Completing Setup</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f7fbff;
            color: #1f2937;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 440px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 20px;
            border: 4px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        .error {
            color: #b91c1c;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="spinner" id="loadingSpinner"></div>

        <p id="statusMessage">
            Completing your LungSight account setup...
        </p>

    </div>

    <script>
        (function () {
            "use strict";

            // ==========================================
            // 1. ENVIRONMENT CONFIGURATION
            // ==========================================

            const urlParams = new URLSearchParams(
                window.location.search
            );

            const environment = (
                urlParams.get("env") || "production"
            ).toLowerCase();

            const BASE_URLS = {
                local: "http://localhost:8501/",
                production: "https://lungsight-ai.streamlit.app/"
            };

            const baseUrl =
                environment === "local"
                    ? BASE_URLS.local
                    : BASE_URLS.production;

            // ==========================================
            // 2. READ SUPABASE CALLBACK
            // ==========================================

            const hash = window.location.hash;

            const hashParams = new URLSearchParams(
                hash.startsWith("#")
                    ? hash.substring(1)
                    : ""
            );

            const accessToken = hashParams.get(
                "access_token"
            );

            const refreshToken = hashParams.get(
                "refresh_token"
            );

            const authType = (
                hashParams.get("type") ||
                urlParams.get("type") ||
                "invite"
            ).toLowerCase();

            const authError =
                hashParams.get("error") ||
                urlParams.get("error");

            const errorCode =
                hashParams.get("error_code") ||
                urlParams.get("error_code");

            // ==========================================
            // 3. HELPER: REDIRECT TO LUNGSIGHT
            // ==========================================

            function redirectToApp(params) {
                const destination = new URL(baseUrl);

                params.forEach(function (value, key) {
                    destination.searchParams.set(
                        key,
                        value
                    );
                });

                // Do not retain the Supabase fragment
                // in the GitHub Pages browser history.
                window.history.replaceState(
                    null,
                    "",
                    window.location.pathname +
                    window.location.search
                );

                window.location.replace(
                    destination.toString()
                );
            }

            // ==========================================
            // 4. HANDLE SUPABASE ERRORS
            // ==========================================

            if (authError || errorCode) {
                const params = new URLSearchParams();

                params.set(
                    "auth_error",
                    "invalid_or_expired_link"
                );

                params.set("type", authType);

                redirectToApp(params);
                return;
            }

            // ==========================================
            // 5. HANDLE VALID AUTH TOKENS
            // ==========================================

            if (accessToken && refreshToken) {
                const params = new URLSearchParams();

                params.set(
                    "access_token",
                    accessToken
                );

                params.set(
                    "refresh_token",
                    refreshToken
                );

                params.set("type", authType);

                redirectToApp(params);
                return;
            }

            // ==========================================
            // 6. HANDLE MISSING / EXPIRED TOKENS
            // ==========================================

            const params = new URLSearchParams();

            params.set(
                "auth_error",
                "invalid_or_expired_link"
            );

            params.set("type", authType);

            redirectToApp(params);

        })();
    </script>

</body>
</html>
